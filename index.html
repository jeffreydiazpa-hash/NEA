<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEA · Bureau d'Études Paramétrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f10; --panel:#14181a; --panel-2:#191e20; --grid-line:#20262a;
  --text:#e9ebe7; --text-dim:#8d9b9a; --text-faint:#5a6566;
  --cyan:#5fd8e6; --orange:#ff7a3d; --border:#262d2f;
  --danger:#ff6b6b; --ok:#7ee787;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:32px 32px; background-position:-1px -1px;
  min-height:100vh;
}
a{color:inherit; text-decoration:none;}
.mono{font-family:'JetBrains Mono', monospace;}
.display{font-family:'Space Grotesk', sans-serif;}
::selection{background:var(--cyan); color:#0c0f10;}

/* ---------- shared bits ---------- */
.btn{font-family:'JetBrains Mono', monospace; font-size:12px; border:1px solid var(--border); background:transparent; color:var(--text); padding:8px 14px; cursor:pointer; transition:all .15s; border-radius:1px;}
.btn:hover{border-color:var(--cyan); color:var(--cyan);}
.btn-primary{background:var(--cyan); color:#0c0f10; border-color:var(--cyan);}
.btn-primary:hover{background:transparent; color:var(--cyan);}
.btn-danger:hover{border-color:var(--danger); color:var(--danger);}
.btn-sm{padding:5px 10px; font-size:11px;}
input,select,textarea{width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; font-family:'JetBrains Mono', monospace; font-size:13px; border-radius:1px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--cyan);}
label{display:block; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;}
.field-note{font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.4;}
.card{background:var(--panel); border:1px solid var(--border); padding:20px; margin-bottom:16px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; padding:8px 8px; border-bottom:1px solid var(--border);}
td{padding:9px 8px; border-bottom:1px solid var(--grid-line); vertical-align:middle;}
tr:hover td{background:var(--panel-2);}
.pill{display:inline-block; font-family:'JetBrains Mono', monospace; font-size:10px; padding:3px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;}
.tag-cyan{background:rgba(95,216,230,.12); color:var(--cyan); border:1px solid rgba(95,216,230,.3);}
.tag-orange{background:rgba(255,122,61,.12); color:var(--orange); border:1px solid rgba(255,122,61,.3);}
.tag-dim{background:rgba(141,155,154,.1); color:var(--text-dim); border:1px solid var(--border);}
.metric{background:var(--panel-2); border:1px solid var(--border); padding:16px;}
.metric .lbl{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
.metric .val{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; margin-top:6px;}
h2.mod-title{font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:600; margin-bottom:4px;}
.mod-desc{color:var(--text-dim); font-size:13px; margin-bottom:20px;}
.toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:20px;}
.tab{font-family:'JetBrains Mono', monospace; font-size:12px; padding:10px 16px; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent;}
.tab.active{color:var(--cyan); border-bottom-color:var(--cyan);}
.empty{color:var(--text-faint); font-size:13px; padding:24px; text-align:center; border:1px dashed var(--border);}
.save-indicator{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); transition:opacity .3s;}

/* ---------- public site ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
#public header{position:fixed; top:0; left:0; right:0; z-index:100; backdrop-filter:blur(10px); background:rgba(12,15,16,.75); border-bottom:1px solid var(--border);}
#public nav.wrap{display:flex; align-items:center; justify-content:space-between; height:64px;}
.logo{font-family:'JetBrains Mono', monospace; font-size:14px; display:flex; align-items:center; gap:8px;}
.logo .dot{width:7px;height:7px;background:var(--cyan); display:inline-block; transform:rotate(45deg);}
.navlinks{display:flex; gap:32px; font-size:13px; font-family:'JetBrains Mono', monospace;}
.navlinks a{color:var(--text-dim); transition:color .2s;}
.navlinks a:hover{color:var(--cyan);}
.lang-switch{font-size:11px; display:flex; align-items:center; gap:6px;}
.lang-opt{color:var(--text-faint); cursor:pointer; transition:color .2s;}
.lang-opt:hover{color:var(--text);}
.lang-opt.active{color:var(--cyan);}
.lang-sep{color:var(--border);}
#public .hero{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding-top:64px;}
.hero-inner{display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;}
.eyebrow{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--cyan); letter-spacing:.12em; text-transform:uppercase; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
.eyebrow::before{content:''; width:24px; height:1px; background:var(--cyan);}
h1.display{font-size:clamp(34px,5vw,58px); line-height:1.08; font-weight:600; letter-spacing:-.02em; max-width:760px;}
#public .lede{margin-top:22px; font-size:16px; line-height:1.6; color:var(--text-dim); max-width:520px;}
.hero-actions{display:flex; gap:14px; margin-top:32px;}
.stats-row{display:flex; gap:36px; margin-top:48px; padding-top:24px; border-top:1px solid var(--border);}
.stat .num{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600;}
.stat .lbl{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:4px;}
.graph-box{position:relative; aspect-ratio:1/1.05; border:1px solid var(--border); background:var(--panel);}
.graph-box .tag{position:absolute; top:14px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint);}
.graph-box .tag2{position:absolute; bottom:14px; right:14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); text-align:right;}
svg.graph{width:100%; height:100%; display:block;}
.gnode rect{fill:var(--panel-2); stroke:var(--border); stroke-width:1;}
.gnode text{font-family:'JetBrains Mono',monospace; font-size:9px; fill:var(--text-dim);}
.gnode .pin{fill:var(--text-faint);}
.wire{fill:none; stroke-width:1.4;}
.wire.c{stroke:var(--cyan); opacity:.85;}
.wire.o{stroke:var(--orange); opacity:.75;}
.wire-anim{stroke-dasharray:4 5; animation:dash 18s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-400;}}
section.block{padding:100px 0;}
.hairline{border-top:1px solid var(--border);}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:14px;}
.sec-num{font-family:'JetBrains Mono', monospace; color:var(--text-faint); font-size:12px;}
.sec-title{font-family:'Space Grotesk', sans-serif; font-size:clamp(24px,3vw,34px); font-weight:600;}
.sec-sub{font-size:13.5px; color:var(--text-dim); max-width:380px;}
.proj-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border);}
.proj-card{background:var(--bg);}
.proj-thumb{position:relative; aspect-ratio:4/3; background:repeating-linear-gradient(135deg, var(--panel-2) 0px, var(--panel-2) 2px, var(--panel) 2px, var(--panel) 26px); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); border-bottom:1px solid var(--border);}
.proj-body{padding:20px;}
.proj-tag{font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--cyan); text-transform:uppercase; letter-spacing:.06em;}
.proj-name{font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:600; margin-top:6px;}
.proj-desc{font-size:13px; color:var(--text-dim); margin-top:8px; line-height:1.55;}
.proj-tools{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
.proj-tools span{font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--text-faint); border:1px solid var(--border); padding:3px 8px;}
.about-grid{display:grid; grid-template-columns:.9fr 1.1fr; gap:56px; align-items:start;}
.about-text p{font-size:14.5px; line-height:1.75; color:var(--text-dim); margin-bottom:16px;}
.skill-cols{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
.skill-group h4{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px;}
.skill-group ul{list-style:none;}
.skill-group li{font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; color:var(--text);}
.skill-group li span.lvl{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint);}
.serv-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border);}
.serv-card{background:var(--bg); padding:26px 22px; min-height:190px; display:flex; flex-direction:column; justify-content:space-between;}
.serv-num{font-family:'JetBrains Mono',monospace; color:var(--orange); font-size:12px;}
.serv-title{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; margin-top:14px; line-height:1.3;}
.serv-desc{font-size:12.5px; color:var(--text-dim); margin-top:8px; line-height:1.55;}
.contact-grid{display:grid; grid-template-columns:1.2fr .8fr; gap:50px; align-items:end;}
.contact-title{font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,4.5vw,48px); font-weight:600; line-height:1.12; letter-spacing:-.02em;}
.contact-email{display:inline-block; margin-top:24px; font-family:'JetBrains Mono',monospace; font-size:15px; color:var(--cyan); border-bottom:1px solid var(--cyan); padding-bottom:4px;}
.contact-meta{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); line-height:2;}
.contact-meta .k{color:var(--text-dim);}
#public footer{padding:32px 0; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-size:12px; color:var(--text-faint); font-family:'JetBrains Mono',monospace; flex-wrap:wrap; gap:12px;}
#public footer a{color:var(--text-dim); margin-left:16px; transition:color .2s;}
#public footer a:hover{color:var(--cyan);}
@media (max-width:880px){.hero-inner{grid-template-columns:1fr;} .graph-box{order:-1; aspect-ratio:16/10;} .about-grid,.contact-grid{grid-template-columns:1fr; gap:32px;}}
@media (max-width:800px){.proj-grid,.serv-grid{grid-template-columns:1fr 1fr;} .navlinks{display:none;} .stats-row{flex-wrap:wrap; row-gap:16px;}}
@media (max-width:560px){.proj-grid,.serv-grid{grid-template-columns:1fr;}}
@media (prefers-reduced-motion: reduce){.wire-anim{animation:none;}}

/* ---------- admin shell ---------- */
#admin-shell{display:flex; min-height:100vh;}
.sidebar{width:220px; border-right:1px solid var(--border); background:var(--panel); flex-shrink:0; display:flex; flex-direction:column; padding:20px 0;}
.sidebar .brand{font-family:'JetBrains Mono',monospace; font-size:13px; padding:0 20px 20px; border-bottom:1px solid var(--border); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.sidebar .brand .dot{width:7px;height:7px;background:var(--cyan); transform:rotate(45deg);}
.sidebar nav{flex:1;}
.sidebar a{display:flex; align-items:center; gap:10px; padding:10px 20px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text-dim); border-left:2px solid transparent;}
.sidebar a:hover{color:var(--text); background:var(--panel-2);}
.sidebar a.active{color:var(--cyan); border-left-color:var(--cyan); background:var(--panel-2);}
.sidebar .idx{color:var(--text-faint); width:18px; display:inline-block;}
.sidebar .foot{padding:14px 20px; border-top:1px solid var(--border);}
.content{flex:1; padding:32px 40px; max-width:1100px;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
.topbar .eyebrow{margin-bottom:0;}
#login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center;}
.login-box{width:320px; text-align:center;}
.login-box .logo{justify-content:center; margin-bottom:24px;}
.err{color:var(--danger); font-size:12px; margin-top:8px; font-family:'JetBrains Mono',monospace;}
.kanban{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; align-items:start;}
.kanban-col{background:var(--panel-2); border:1px solid var(--border); min-height:60px;}
.kanban-col h4{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; padding:10px 12px; border-bottom:1px solid var(--border);}
.kanban-card{padding:10px 12px; border-bottom:1px solid var(--border); font-size:12.5px;}
.kanban-card .n{font-weight:600; color:var(--text); margin-bottom:3px;}
.kanban-card .c{color:var(--text-dim); font-size:11.5px;}
</style>

<script>
/* ============================= DATA LAYER ============================= */
const PIPELINE_STAGES = ['Prospección','Propuesta enviada','En negociación','Aprobado','En curso','Entregado','Facturado','Cerrado'];
const MADUREZ = ['Prototipo','Production-ready','Vendible'];

const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwSjf03pd4ht3nUkHBh6IchNJAoo2QFrdvG5V_9GNZA2NNrPMAmvt-AySoFP6PsZ5yG/exec'
};

// Esqueleto vacío — se rellena desde el GAS tras el login. No hay datos de ejemplo
// para que un guardado accidental antes de cargar nunca sobreescriba el Sheet real.
let DB = {
  proyectos: [], clientes: [], biblioteca: [], tiempo: [], gastos: [], documentos: [],
  sesionesTrabajo: [], comptesRendus: [], tareas: [], pagos: [],
  fiscal: { avisYear:2025, rfr:0, parts:1, autresRevenus:0, dateAvis:'', cotisationRate:0.256, acre:'no', vlRequested:'no', vlThreshold:29315, tranches:[] }
};
let session = { authed:false, token:null, expiresAt:null, loaded:false };

async function gasGet(action, params={}){
  const url = new URL(CONFIG.GAS_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString());
  return res.json();
}
async function gasPost(action, payload={}){
  const res = await fetch(CONFIG.GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight OPTIONS, que Apps Script no maneja
    body: JSON.stringify(Object.assign({action}, payload))
  });
  return res.json();
}

async function loadFromGAS(){
  const ind = document.getElementById('save-indicator');
  if(ind) ind.textContent = 'cargando…';
  const r = await gasGet('bootstrap', {token: session.token});
  if(r.ok){
    DB = Object.assign(DB, r.data);
    session.loaded = true;
    if(ind) ind.textContent = '';
  } else {
    if(ind) ind.textContent = 'error al cargar: '+(r.error||'?');
    if(String(r.error||'').includes('sesión')){ session.authed=false; session.token=null; navigate('admin'); }
  }
}

let saveTimeout=null;
function saveDB(){
  if(!session.token) return; // sin sesión no se guarda nada
  clearTimeout(saveTimeout);
  const ind = document.getElementById('save-indicator');
  if(ind) ind.textContent = 'guardando…';
  saveTimeout = setTimeout(async ()=>{
    try{
      const r = await gasPost('saveState', {token: session.token, data: DB});
      if(ind) ind.textContent = r.ok ? 'guardado ✓' : ('error: '+(r.error||'?'));
    }catch(e){ if(ind) ind.textContent='error de red al guardar'; }
    setTimeout(()=>{ if(ind) ind.textContent=''; },2000);
  }, 600);
}
function fmt(n){ return Math.round(n||0).toLocaleString('fr-FR') + ' €'; }
function uid(list){ return list.length ? Math.max(...list.map(x=>x.id))+1 : 1; }

/* ============================= ROUTER (hash, como #karen en Fais Cute) ============================= */
window.addEventListener('hashchange', route);
window.addEventListener('load', route);
function navigate(path){ location.hash = path; } // path sin '#', ej. 'admin/dashboard'
function adminSubpath(){
  return location.hash.replace(/^#admin\/?/,'');
}
function route(){
  if(location.hash.startsWith('#admin')){
    if(!session.authed){ renderLogin(); }
    else if(!session.loaded){ renderLoading(); loadFromGAS().then(()=>route()); }
    else{ renderAdmin(adminSubpath()); }
  } else {
    renderPublic();
  }
}
function renderLoading(){
  document.getElementById('app').innerHTML = `<div id="login-screen"><div class="login-box"><div class="logo" style="justify-content:center;"><span class="dot"></span> NEA</div><p class="field-note" style="margin-top:16px;">Cargando datos desde el backend…</p></div></div>`;
}

/* ============================= LOGIN ============================= */
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div id="login-screen">
      <div class="login-box">
        <div class="logo"><span class="dot"></span> NEA</div>
        <label>PIN de administrador</label>
        <input type="password" id="pin-input" placeholder="••••">
        <div class="err" id="login-err"></div>
        <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="tryLogin()">Entrar</button>
        <div class="field-note" style="margin-top:16px;">Prototipo: la sesión no persiste al recargar la página. En producción, el backend GAS gestionará el token de sesión con expiración real.</div>
        <div style="margin-top:20px;"><a href="#" class="mono" style="font-size:12px; color:var(--text-faint);">← volver al sitio público</a></div>
      </div>
    </div>`;
  document.getElementById('pin-input').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}
async function tryLogin(){
  const val = document.getElementById('pin-input').value;
  const btn = document.querySelector('#login-screen .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'verificando…'; }
  try{
    const r = await gasPost('login', {pin: val});
    if(r.ok){
      session.authed = true; session.token = r.token; session.expiresAt = r.expiresAt; session.loaded = false;
      navigate('admin/dashboard');
    } else {
      document.getElementById('login-err').textContent = r.error || 'PIN incorrecto.';
      if(btn){ btn.disabled=false; btn.textContent='Entrar'; }
    }
  }catch(e){
    document.getElementById('login-err').textContent = 'No se pudo contactar al servidor. Revisa la URL del GAS o tu conexión.';
    if(btn){ btn.disabled=false; btn.textContent='Entrar'; }
  }
}
function logout(){
  if(session.token) gasPost('logout', {token: session.token}).catch(()=>{});
  session.authed = false; session.token = null; session.loaded = false;
  location.hash = '';
}

function renderPublic(){
  const t = I18N[currentLang];
  renderPublicShell(t);
  gasGet('publicProjects').then(r=>{
    const items = (r && r.ok) ? r.data : [];
    const el = document.getElementById('proj-grid-public');
    if(el) el.outerHTML = buildPublicProjGrid(items, t);
  }).catch(()=>{
    const el = document.getElementById('proj-grid-public');
    if(el) el.innerHTML = `<div class="empty" style="grid-column:1/-1;">${t.loadError}</div>`;
  });
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const activos = DB.proyectos.filter(p=>p.etapa!=='Cerrado' && p.etapa!=='Facturado');
  const caFacturado = DB.proyectos.filter(p=>['Facturado','Cerrado'].includes(p.etapa)).reduce((s,p)=>s+ (p.honorarios||0),0);
  const pipelineValue = DB.proyectos.filter(p=>['Prospección','Propuesta enviada','En negociación'].includes(p.etapa)).reduce((s,p)=>s+(p.honorarios||0),0);
  const horasFact = DB.tiempo.filter(t=>t.facturable).reduce((s,t)=>s+t.horas,0);
  const horasTotal = DB.tiempo.reduce((s,t)=>s+t.horas,0);
  const utilizacion = horasTotal ? Math.round((horasFact/horasTotal)*100) : 0;
  const gastosTotal = DB.gastos.reduce((s,g)=>s+g.monto,0);

  root().innerHTML = `
    <h2 class="mod-title">Resumen ejecutivo</h2>
    <p class="mod-desc">Vista rápida del estado de NEA — no incluye el portafolio público.</p>

      <div class="metric"><div class="lbl">Tasa de utilización</div><div class="val">${utilizacion}%</div></div>
      <div class="metric"><div class="lbl">Gastos registrados</div><div class="val">${fmt(gastosTotal)}</div></div>
      <div class="metric"><div class="lbl">Definiciones en biblioteca</div><div class="val">${DB.biblioteca.length}</div></div>
    </div>
    <div class="card">
      <h3 style="font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:14px;">Pipeline por etapa</h3>
      <div class="kanban">
        ${PIPELINE_STAGES.map(st=>{

function toggleEditProyecto(id){ editingProyectoId = editingProyectoId===id ? null : id; renderProyectos(); }
function saveEditProyecto(id){
  const p = DB.proyectos.find(x=>x.id===id);
  if(!p) return;
  const g = f => document.getElementById(f+'-'+id).value;
  p.nombre = g('e-nombre').trim() || p.nombre;
  p.cliente = g('e-cliente');
  p.tipo = g('e-tipo');
  p.honorarios = parseFloat(g('e-honorarios'))||0;
  p.horasEst = parseFloat(g('e-horasEst'))||0;
  p.horasReal = parseFloat(g('e-horasReal'))||0;
  p.fecha = g('e-fecha');
  p.notas = g('e-notas');
  editingProyectoId = null;
  saveDB(); renderProyectos();
}

/* ============================= GESTIÓN DE PROYECTO (detalle) ============================= */
// Sesiones de trabajo (cronómetro), CR de reuniones y tareas, todo por proyecto.
// Es el equivalente al módulo Bureau d'Études > Proyectos de HP Manager.

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h>0? h+'h ':'') + String(m).padStart(2,'0')+'m '+String(sec).padStart(2,'0')+'s';
}
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

function activeSessionGlobal(){ return DB.sesionesTrabajo.find(s=>s.fin===null||s.fin===undefined); }

let currentProyectoDetalleId = null;
let currentProyectoTab = 'resumen';
const PROYECTO_TABS = [['resumen','Resumen'],['sesiones','Sesiones'],['cr','CR'],['tareas','Tareas'],['documentos','Documentos'],['pagos','Pagos']];
function setProyectoTab(tab){ currentProyectoTab = tab; renderProyectoDetalle(currentProyectoDetalleId); }

function renderProyectoDetalle(id){
  const p = DB.proyectos.find(x=>x.id===id);
  if(!p){ root().innerHTML = `<div class="empty">Proyecto no encontrado.</div>`; return; }
  if(currentProyectoDetalleId !== id){ currentProyectoDetalleId = id; currentProyectoTab = 'resumen'; }
  const sesiones = DB.sesionesTrabajo.filter(s=>s.proyectoId===id).sort((a,b)=>new Date(b.inicio)-new Date(a.inicio));
  const crs = DB.comptesRendus.filter(c=>c.proyectoId===id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const tareas = DB.tareas.filter(t=>t.proyectoId===id);
  const documentos = DB.documentos.filter(d=>d.proyectoId===id);
  const pagos = DB.pagos.filter(pg=>pg.proyectoId===id);
  const activa = activeSessionGlobal();
  const activaEsteProyecto = activa && activa.proyectoId===id;
  const totalHorasSesiones = sesiones.filter(s=>s.fin).reduce((s,x)=>s+(new Date(x.fin)-new Date(x.inicio)),0)/3600000;

  let tabContent = '';
  if(currentProyectoTab==='resumen') tabContent = buildResumenTab(p, tareas, pagos);
  else if(currentProyectoTab==='sesiones') tabContent = buildSesionesTab(sesiones, totalHorasSesiones);
  else if(currentProyectoTab==='cr') tabContent = buildCRTab(id, crs);
  else if(currentProyectoTab==='tareas') tabContent = buildTareasTab(id, tareas);
  else if(currentProyectoTab==='documentos') tabContent = buildDocumentosTab(id, documentos);
  else if(currentProyectoTab==='pagos') tabContent = buildPagosTab(id, pagos);

  root().innerHTML = `
    <a href="#admin/proyectos" class="mono" style="font-size:11.5px; color:var(--text-faint);">← volver a proyectos</a>
    <h2 class="mod-title" style="margin-top:10px;">${p.nombre}</h2>
    <p class="mod-desc">${p.cliente} · ${p.tipo||''} · <span class="pill tag-dim">${p.etapa}</span> · ${fmt(p.honorarios)}</p>
    <div class="card" id="timer-card"></div>
    <div class="tabs">${PROYECTO_TABS.map(([k,l])=>`<div class="tab ${currentProyectoTab===k?'active':''}" onclick="setProyectoTab('${k}')">${l}</div>`).join('')}</div>
    <div id="proyecto-tab-content">${tabContent}</div>`;

  renderTimerCard(p, activa, activaEsteProyecto);
  clearSessionTimer();
  if(activaEsteProyecto){
    sessionTimerInterval = setInterval(()=>updateTimerDisplay(activa), 1000);
  }
}

/* ---- Pestaña Resumen ---- */
function buildResumenTab(p, tareas, pagos){
  const avance = p.horasEst ? Math.min(100, Math.round((p.horasReal||0)/p.horasEst*100)) : null;
  const rentabilidad = p.honorarios - (p.horasReal||0)*65;
  const pendientes = tareas.filter(t=>t.estado!=='Hecho');
  const proxima = pendientes.filter(t=>t.fecha).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))[0];
  const totalCobrado = pagos.filter(pg=>pg.estado==='Cobrado').reduce((s,pg)=>s+(pg.monto||0),0);
  return `
    <div class="grid" style="margin-bottom:16px;">
      <div class="metric"><div class="lbl">Avance (horas)</div><div class="val">${avance!==null?avance+'%':'—'}</div></div>
      <div class="metric"><div class="lbl">Rentabilidad estimada</div><div class="val" style="color:${rentabilidad>=0?'var(--ok)':'var(--danger)'}">${fmt(rentabilidad)}</div></div>
      <div class="metric"><div class="lbl">Tareas pendientes</div><div class="val">${pendientes.length}</div></div>
      <div class="metric"><div class="lbl">Cobrado / honorarios</div><div class="val">${fmt(totalCobrado)} / ${fmt(p.honorarios)}</div></div>
    </div>
    ${proxima? `<div class="card" style="border-color:var(--orange); background:rgba(255,122,61,.06); margin-bottom:16px;">Próximo vencimiento: <b style="color:var(--text)">${proxima.titulo}</b> — ${proxima.fecha}</div>` : ''}
    <div class="card">
      <div class="toolbar" style="margin-bottom:0;">
        <h3 style="font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0;">Ficha del proyecto</h3>
        <button class="btn btn-sm" onclick="toggleEditProyecto(${p.id})">${editingProyectoId===p.id?'Cerrar':'Editar ficha'}</button>
      </div>
      ${editingProyectoId===p.id ? `<table style="margin-top:14px;"><tbody>${renderEditProyectoForm(p)}</tbody></table>` : `
      <div class="grid" style="margin-top:14px;">
        <div><label>Cliente</label><div class="mono" style="padding-top:4px; font-size:13px;">${p.cliente||'—'}</div></div>
        <div><label>Tipo</label><div class="mono" style="padding-top:4px; font-size:13px;">${p.tipo||'—'}</div></div>
        <div><label>Fecha</label><div class="mono" style="padding-top:4px; font-size:13px;">${p.fecha||'—'}</div></div>
        <div><label>Horas est. / reales</label><div class="mono" style="padding-top:4px; font-size:13px;">${p.horasEst||0} / ${p.horasReal||0}</div></div>
      </div>
      <div style="margin-top:14px;"><label>Notas internas</label><div style="font-size:13px; color:var(--text-dim); margin-top:4px;">${p.notas||'—'}</div></div>`}
    </div>`;
}

function addDocumentoProyecto(proyectoId){
  const nombre = document.getElementById('dp-nombre').value.trim();

  saveDB(); renderProyectoDetalle(proyectoId);
}

function addPago(proyectoId){
  const monto = parseFloat(document.getElementById('pg-monto').value)||0;
  const concepto = document.getElementById('pg-concepto').value.trim();
  if(!concepto||!monto) return alert('Falta el concepto o el monto.');
  DB.pagos.push({id:uid(DB.pagos), proyectoId, concepto, monto, fechaPrevista:document.getElementById('pg-fechaPrevista').value, estado:document.getElementById('pg-estado').value, fechaCobro:''});
  saveDB(); renderProyectoDetalle(proyectoId);
}
function setPagoEstado(id, estado){
  const pg = DB.pagos.find(x=>x.id===id);
  if(pg){ pg.estado=estado; if(estado==='Cobrado' && !pg.fechaCobro) pg.fechaCobro=new Date().toISOString().slice(0,10); saveDB(); route(); }
}

      <div><label>Fecha prevista</label><input type="date" id="e-fechaPrevista-${pg.id}" value="${pg.fechaPrevista||''}"></div>
      <div><label>Estado</label><select id="e-estado-${pg.id}">${['Pendiente','Facturado','Cobrado'].map(e=>`<option ${e===pg.estado?'selected':''}>${e}</option>`).join('')}</select></div>

function renderTimerCard(p, activa, activaEsteProyecto){
  const card = document.getElementById('timer-card');
  if(!card) return;
  if(activaEsteProyecto){
    card.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;">
        <div>
          <div class="mono" style="font-size:11px; color:var(--cyan); text-transform:uppercase; letter-spacing:.05em;">Sesión en curso</div>
          <div id="timer-display" class="display" style="font-size:32px; font-weight:600; margin-top:4px;">00h 00m 00s</div>
          <div class="field-note" style="margin-top:4px;">Iniciada a las ${fmtDateTime(activa.inicio)}</div>
        </div>
        <button class="btn btn-danger" style="border-color:var(--danger); color:var(--danger); font-size:14px; padding:14px 22px;" onclick="stopSession()">⏸ Detener sesión</button>
      </div>`;
    updateTimerDisplay(activa);
  } else if(activa){
    card.innerHTML = `<div class="field-note">Tienes una sesión activa en otro proyecto (<b style="color:var(--text)">${(DB.proyectos.find(x=>x.id===activa.proyectoId)||{}).nombre||'?'}</b>) desde las ${fmtDateTime(activa.inicio)}. Detenla antes de abrir una nueva. <button class="btn btn-sm" style="margin-left:8px;" onclick="stopSession()">Detener esa sesión</button></div>`;
  } else {
    card.innerHTML = `<button class="btn btn-primary" style="font-size:14px; padding:14px 22px;" onclick="startSession(${p.id})">▶ Iniciar sesión de trabajo</button>`;
  }
}
function updateTimerDisplay(activa){
  const el = document.getElementById('timer-display');
  if(!el) return;
  el.textContent = fmtDuration(new Date() - new Date(activa.inicio));
}
function startSession(proyectoId){
  if(activeSessionGlobal()) return alert('Ya hay una sesión activa — detenla primero.');
  DB.sesionesTrabajo.push({id:uid(DB.sesionesTrabajo), proyectoId, inicio:new Date().toISOString(), fin:null, nota:''});
  saveDB(); renderProyectoDetalle(proyectoId);
}
function stopSession(){
  const s = activeSessionGlobal();
  if(!s) return;
  s.fin = new Date().toISOString();
  const horas = (new Date(s.fin)-new Date(s.inicio))/3600000;
  DB.tiempo.push({id:uid(DB.tiempo), proyectoId:s.proyectoId, fecha:s.fin.slice(0,10), horas: Math.round(horas*100)/100, tarifa:65, facturable:true});
  const p = DB.proyectos.find(x=>x.id===s.proyectoId);
  if(p) p.horasReal = Math.round(((p.horasReal||0)+horas)*100)/100;
  saveDB();
  // Registro en Google Calendar — guardamos el eventId para poder borrar/actualizar
  // el evento después si la sesión se edita o se elimina (mismo comportamiento que Projet Manager).
  if(session.token && p){
    gasPost('logSession', {token: session.token, data:{proyecto:p.nombre, inicio:s.inicio, fin:s.fin, nota:s.nota||''}})
      .then(r=>{
        if(r.ok){ s.calendarEventId = r.eventId; saveDB(); }
        else console.warn('No se pudo crear el evento de calendario:', r.error);
      })
      .catch(()=>{});
  }
  renderProyectoDetalle(s.proyectoId);
}

// Módulo dedicado a decidir qué se muestra en el sitio público y cómo — separado
// de la gestión operativa del proyecto (eso vive en Proyectos).
let portafolioEditId = null;
let portafolioLang = 'fr';
let portafolioPreviewLang = 'fr';

function renderPortafolio(){
  const total = DB.proyectos.length;
  const publicados = DB.proyectos.filter(p=>p.publicable).length;
  const sorted = [...DB.proyectos].sort((a,b)=>(a.ordenPublico||0)-(b.ordenPublico||0));

  const savedLang = currentLang;
  currentLang = portafolioPreviewLang;
  const previewHtml = buildPublicProjGrid(
    sorted.filter(p=>p.publicable).map(proyectoToPublicShape),
    {emptyProj:'Ningún proyecto publicable todavía — activa alguno en la tabla de arriba.'}
  );
  currentLang = savedLang;

  root().innerHTML = `
    <h2 class="mod-title">Portafolio</h2>
    <p class="mod-desc">Qué proyectos se muestran en el sitio público, en qué orden, destacados o no, y con qué contenido en cada idioma. Los datos internos (honorarios, cliente, horas) nunca salen de aquí.</p>
    <div class="grid" style="margin-bottom:20px;">
      <div class="metric"><div class="lbl">Publicados</div><div class="val">${publicados} / ${total}</div></div>
      <div class="metric"><div class="lbl">Destacados</div><div class="val">${DB.proyectos.filter(p=>p.destacado).length}</div></div>
    </div>
    <table>
      <thead><tr><th>Proyecto</th><th>Etapa</th><th>Publicable</th><th>Destacado</th><th>Orden</th><th></th></tr></thead>
      <tbody>${sorted.map(p=>`
        <tr>
          <td>${p.nombre}</td>
          <td><span class="pill tag-dim">${p.etapa}</span></td>
          <td><input type="checkbox" ${p.publicable?'checked':''} onchange="togglePortafolioPublicable(${p.id}, this.checked)"></td>
          <td><input type="checkbox" ${p.destacado?'checked':''} onchange="togglePortafolioDestacado(${p.id}, this.checked)"></td>
          <td><input type="number" style="width:64px;" value="${p.ordenPublico||0}" onchange="setPortafolioOrden(${p.id}, this.value)"></td>
          <td><button class="btn btn-sm" onclick="togglePortafolioEdit(${p.id})">${portafolioEditId===p.id?'Cerrar':'Editar contenido'}</button></td>
        </tr>
        ${portafolioEditId===p.id ? renderPortafolioEditForm(p) : ''}
      `).join('') || `<tr><td colspan="6" class="empty">Sin proyectos — créalos primero en el módulo Proyectos.</td></tr>`}
      </tbody>
    </table>

    <div class="card" style="margin-top:24px;">
      <div class="toolbar" style="margin-bottom:14px;">
        <h3 style="font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0;">Vista previa — así lo verá un visitante</h3>
        <div class="lang-switch mono">${['fr','es','en'].map(l=>`<span class="lang-opt ${l===portafolioPreviewLang?'active':''}" onclick="setPortafolioPreviewLang('${l}')">${l.toUpperCase()}</span>`).join('<span class="lang-sep">/</span>')}</div>
      </div>
      <div style="background:var(--bg); padding:20px; border:1px solid var(--border);">${previewHtml}</div>
    </div>`;
}
function proyectoToPublicShape(p){
  return {
    nombre: p.nombre, tipo: p.tipo, destacado: p.destacado,
    fr: {tag:p.publicTag, desc:p.publicDesc, tools:p.publicTools},
    es: {tag:p.publicTag_es, desc:p.publicDesc_es, tools:p.publicTools_es},
    en: {tag:p.publicTag_en, desc:p.publicDesc_en, tools:p.publicTools_en}
  };
}
function setPortafolioPreviewLang(l){ portafolioPreviewLang = l; renderPortafolio(); }
function togglePortafolioPublicable(id, val){
  const p = DB.proyectos.find(x=>x.id===id);
  if(p){
    p.publicable = val;
    if(val && !p.publicTag) p.publicTag = p.tipo;
    if(val && !p.publicDesc) p.publicDesc = p.notas||'';
    if(val && p.ordenPublico===undefined) p.ordenPublico = DB.proyectos.length;
    saveDB(); renderPortafolio();
  }
}
function togglePortafolioDestacado(id, val){ const p=DB.proyectos.find(x=>x.id===id); if(p){ p.destacado=val; saveDB(); renderPortafolio(); } }
function setPortafolioOrden(id, val){ const p=DB.proyectos.find(x=>x.id===id); if(p){ p.ordenPublico=parseInt(val)||0; saveDB(); renderPortafolio(); } }
function togglePortafolioEdit(id){ portafolioEditId = portafolioEditId===id ? null : id; portafolioLang='fr'; renderPortafolio(); }
function setPortafolioLang(id, lang){ savePortafolioLangFields(id); portafolioLang = lang; renderPortafolio(); }
function savePortafolioLangFields(id){
  const p = DB.proyectos.find(x=>x.id===id); if(!p) return;
  const L = portafolioLang, suf = L==='fr' ? '' : '_'+L;
  const g = f => { const el = document.getElementById(f+'-'+id); return el ? el.value : undefined; };
  const tag=g('pf-tag'), tools=g('pf-tools'), desc=g('pf-desc');
  if(tag!==undefined) p['publicTag'+suf]=tag;
  if(tools!==undefined) p['publicTools'+suf]=tools;
  if(desc!==undefined) p['publicDesc'+suf]=desc;
}
function savePortafolioAndClose(id){ savePortafolioLangFields(id); saveDB(); portafolioEditId=null; renderPortafolio(); }
function renderPortafolioEditForm(p){
  const L = portafolioLang, suf = L==='fr' ? '' : '_'+L;
  const tag = p['publicTag'+suf]||'', desc = p['publicDesc'+suf]||'', tools = p['publicTools'+suf]||'';
  return `<tr><td colspan="6"><div class="card" style="margin:8px 0 4px; background:var(--panel-2);">
    <div class="toolbar" style="margin-bottom:0;">
      <div class="field-note" style="color:var(--cyan); margin:0;">Contenido público — ${p.nombre}</div>
      <div class="tabs" style="border-bottom:none; margin-bottom:0;">
        ${['fr','es','en'].map(l=>`<div class="tab ${l===L?'active':''}" style="padding:4px 10px;" onclick="setPortafolioLang(${p.id},'${l}')">${l.toUpperCase()}</div>`).join('')}
      </div>
    </div>
    <div class="grid" style="margin-top:12px;">
      <div><label>Tag público (${L.toUpperCase()})</label><input id="pf-tag-${p.id}" value="${tag}"></div>
      <div style="grid-column:span 2;"><label>Herramientas — separadas por coma (${L.toUpperCase()})</label><input id="pf-tools-${p.id}" value="${tools}"></div>
    </div>
    <div style="margin-top:10px;"><label>Descripción pública (${L.toUpperCase()})</label><textarea id="pf-desc-${p.id}" rows="2">${desc}</textarea></div>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn btn-primary" onclick="savePortafolioAndClose(${p.id})">Guardar cambios</button>
      <button class="btn" onclick="togglePortafolioEdit(${p.id})">Cancelar</button>
    </div>
  </div></td></tr>`;
}

function renderEditBibliotecaForm(b){
  return `<tr><td colspan="5"><div class="card" style="margin:8px 0 4px; background:var(--panel-2);">

      <div><label>Plugins usados</label><input id="e-plugins-${b.id}" value="${b.plugins||''}"></div>
      <div><label>Proyectos donde se usó</label><input id="e-proyectos-${b.id}" value="${b.proyectos||''}"></div>
    </div>
    <div style="margin-top:12px;"><label>Descripción</label><textarea id="e-descripcion-${b.id}" rows="2">${b.descripcion||''}</textarea></div>

function saveEditBiblioteca(id){
  const b = DB.biblioteca.find(x=>x.id===id); if(!b) return;
  const g = f => document.getElementById(f+'-'+id).value;
  b.nombre = g('e-nombre').trim() || b.nombre;
  b.madurez = g('e-madurez'); b.plugins = g('e-plugins'); b.proyectos = g('e-proyectos'); b.descripcion = g('e-descripcion');
  editingId.biblioteca = null; saveDB(); renderBiblioteca();
}
function addBiblioteca(){
  const nombre = document.getElementById('b-nombre').value.trim();
  if(!nombre) return alert('Falta el nombre de la definición.');
  DB.biblioteca.push({id:uid(DB.biblioteca), nombre, madurez:document.getElementById('b-madurez').value, plugins:document.getElementById('b-plugins').value, descripcion:document.getElementById('b-desc').value, proyectos:document.getElementById('b-proyectos').value});
  saveDB(); renderBiblioteca();
}

function saveEditTiempo(id){
  const t = DB.tiempo.find(x=>x.id===id); if(!t) return;
  const g = f => document.getElementById(f+'-'+id).value;
  t.proyectoId = parseInt(g('e-proyectoId'))||t.proyectoId;
  t.fecha = g('e-fecha'); t.horas = parseFloat(g('e-horas'))||0; t.tarifa = parseFloat(g('e-tarifa'))||0;
  t.facturable = g('e-facturable')==='true';
  editingId.tiempo = null; saveDB(); renderTiempo();
}
function addTiempo(){
  const proyectoId = parseInt(document.getElementById('t-proyecto').value);
  const horas = parseFloat(document.getElementById('t-horas').value)||0;
  if(!horas) return alert('Indica cuántas horas.');
  DB.tiempo.push({id:uid(DB.tiempo), proyectoId, fecha:document.getElementById('t-fecha').value, horas, tarifa:parseFloat(document.getElementById('t-tarifa').value)||0, facturable: document.getElementById('t-facturable').value==='true'});
  const p = DB.proyectos.find(x=>x.id===proyectoId);
  if(p) p.horasReal = (p.horasReal||0)+horas;
  saveDB(); renderTiempo();
}

      </div>
      ${!addOpen.gastos ? '' : `
      <div class="grid">
        <div><label>Fecha</label><input type="date" id="g-fecha"></div>
        <div><label>Concepto</label><input id="g-concepto"></div>
        <div><label>Monto (€)</label><input type="number" id="g-monto"></div>

      <button class="btn btn-primary" style="margin-top:14px;" onclick="addGasto()">+ registrar gasto</button>`}

    <table style="margin-bottom:24px;">
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Monto</th><th></th></tr></thead>

          <button class="btn btn-sm" onclick="toggleEdit('gastos',${g.id})">${editingId.gastos===g.id?'Cerrar':'Editar'}</button>

        <thead><tr><th>Proyecto</th><th>Honorarios</th><th>Horas reales</th><th>€/h objetivo (65€)</th><th>Rentabilidad</th></tr></thead>
        <tbody>${DB.proyectos.map(p=>{
          const costoHoras = (p.horasReal||0)*65;
          const rent = p.honorarios - costoHoras;

          return `<tr><td>${p.nombre}</td><td>${fmt(p.honorarios)}</td><td>${p.horasReal||0}</td><td>${fmt(costoHoras)}</td>

const BAREME = [{min:0,max:11600,rate:0},{min:11600,max:29579,rate:0.11},{min:29579,max:84577,rate:0.30},{min:84577,max:181917,rate:0.41},{min:181917,max:Infinity,rate:0.45}];
const ABATTEMENT = 0.34, VL_RATE = 0.022, PLAFOND_CA = 77700;
let impuestosTab = 'resumen';

function renderImpuestos(){
  root().innerHTML = `
    <h2 class="mod-title">Impuestos</h2>
    <p class="mod-desc">Estado fiscal de NEA, simulador de optimización y calendario de vencimientos.</p>
    <div class="tabs">
      <div class="tab ${impuestosTab==='resumen'?'active':''}" onclick="setImpuestosTab('resumen')">Resumen</div>
      <div class="tab ${impuestosTab==='simulador'?'active':''}" onclick="setImpuestosTab('simulador')">Simulador VL</div>

    <div id="impuestos-body"></div>`;
  renderImpuestosBody();
}
function setImpuestosTab(t){ impuestosTab = t; renderImpuestos(); }
function renderImpuestosBody(){
  const el = document.getElementById('impuestos-body');
  if(impuestosTab==='resumen') return renderFiscalResumen(el);
  if(impuestosTab==='simulador') return renderFiscalSimulador(el);
  if(impuestosTab==='calendario') return renderFiscalCalendario(el);
}
function renderFiscalResumen(el){
  const f = DB.fiscal;
  const caTotal = f.tranches.reduce((s,t)=>s+t.amount,0);
  const eligible = f.rfr <= f.vlThreshold*f.parts;
  el.innerHTML = `
    <div class="grid" style="margin-bottom:20px;">
      <div class="metric"><div class="lbl">CA acumulado (tramos)</div><div class="val">${fmt(caTotal)}</div></div>
      <div class="metric"><div class="lbl">VL solicitado</div><div class="val" style="font-size:18px;">${f.vlRequested==='si'?'Sí':'No'}</div></div>
      <div class="metric"><div class="lbl">Elegible por RFR</div><div class="val" style="font-size:18px; color:${eligible?'var(--ok)':'var(--danger)'}">${eligible?'Sí':'No'}</div></div>
      <div class="metric"><div class="lbl">% del plafond micro-BNC</div><div class="val">${Math.round((caTotal/PLAFOND_CA)*100)}%</div></div>
    </div>
    <div class="card">
      <div class="grid">
        <div><label>Año del avis (revenus de)</label><input id="f-avisYear" type="number" value="${f.avisYear}" onchange="updateFiscal('avisYear',this.value,true)"></div>
        <div><label>RFR</label><input id="f-rfr" type="number" value="${f.rfr}" onchange="updateFiscal('rfr',this.value,true)"></div>
        <div><label>Partes fiscales</label><input id="f-parts" type="number" step="0.5" value="${f.parts}" onchange="updateFiscal('parts',this.value,true)"></div>
        <div><label>Otros ingresos (salario neto imponible)</label><input id="f-autres" type="number" value="${f.autresRevenus}" onchange="updateFiscal('autresRevenus',this.value,true)"></div>
        <div><label>¿VL solicitado para el próximo año?</label><select onchange="updateFiscal('vlRequested',this.value,false)"><option value="no" ${f.vlRequested==='no'?'selected':''}>No</option><option value="si" ${f.vlRequested==='si'?'selected':''}>Sí</option></select></div>
      </div>
      <p class="field-note" style="margin-top:12px;">Estos datos alimentan el simulador. Actualízalos cada vez que recibas un nuevo avis d'impôt.</p>
    </div>`;
}
function updateFiscal(field, value, isNumber){
  DB.fiscal[field] = isNumber ? parseFloat(value)||0 : value;
  saveDB(); renderImpuestosBody();
}
function renderFiscalCalendario(el){
  const f = DB.fiscal;
  const items = [];
  const y = new Date().getFullYear();
  const deadlineVL = new Date(y,8,30);
  items.push({date:deadlineVL, label:'Fecha límite VL', desc:`Último día para pedir el versement libératoire con efecto 01/01/${y+1}.`});
  [[0,31],[3,30],[6,31],[9,31]].forEach(([m,d])=>{
    let date = new Date(y,m,d);
    if(date < new Date()) date = new Date(y+1,m,d);
    items.push({date, label:'Declaración trimestral URSSAF', desc:'Fecha aproximada — confirma el día exacto en autoentrepreneur.urssaf.fr.'});
  });
  items.push({date:new Date(f.avisYear+2,6,15), label:"Avis d'impôt esperado", desc:`Correspondiente a los ingresos de ${f.avisYear+1}. Actualiza el resumen fiscal cuando llegue.`});
  items.sort((a,b)=>a.date-b.date);
  el.innerHTML = `<div class="card">${items.slice(0,6).map(it=>`
    <div style="display:flex; gap:16px; padding:12px 0; border-top:1px solid var(--border);">
      <div class="mono" style="color:var(--cyan); font-size:12px; min-width:100px;">${it.date.toLocaleDateString('fr-FR')}</div>
      <div><strong style="display:block; font-size:13.5px;">${it.label}</strong><span style="font-size:12.5px; color:var(--text-dim);">${it.desc}</span></div>
    </div>`).join('')}</div>`;
}
function baremeTax(revenu, parts){ const qf=revenu/parts; let tax=0; for(const b of BAREME){ if(qf>b.min) tax += (Math.min(qf,b.max)-b.min)*b.rate; } return tax*parts; }
function decote(impotBrut, parts){ const threshold = parts>=2?3277:1982; const base = parts>=2?1483:897; if(impotBrut<threshold) return Math.max(0, Math.min(impotBrut, base-0.4525*impotBrut)); return 0; }
function irOn(ca, autres, parts){ const w=autres+ca*(1-ABATTEMENT); const bw=baremeTax(w,parts); const iw=Math.max(0,bw-decote(bw,parts)); const b0=baremeTax(autres,parts); const i0=Math.max(0,b0-decote(b0,parts)); return iw-i0; }
function vlActiveFromYear(){ return DB.fiscal.vlRequested==='si' ? (new Date().getFullYear()+1) : null; }
function isEligibleVL(){ return DB.fiscal.rfr <= DB.fiscal.vlThreshold*DB.fiscal.parts; }
function regimeForTranche(t){
  if(t.regime==='classico') return 'classico';
  if(t.regime==='vl') return 'vl';
  const y = new Date(t.date).getFullYear();
  const af = vlActiveFromYear();
  if(af && y>=af && isEligibleVL()) return 'vl';
  return 'classico';
}
function renderFiscalSimulador(el){
  const f = DB.fiscal;
  el.innerHTML = `
    <div id="banners-sim"></div>
    <div class="card">
      <div class="toolbar"><h3 style="font-family:'Space Grotesk',sans-serif; font-size:14px;">Tramos del proyecto</h3><button class="btn btn-sm" onclick="addTranche()">+ añadir tramo</button></div>
      <div id="tranches-sim"></div>
      <div style="height:6px; background:var(--panel-2); border:1px solid var(--border); margin-top:12px;"><div id="threshold-fill" style="height:100%; background:var(--cyan);"></div></div>
      <p class="field-note" id="threshold-note" style="margin-top:8px;"></p>
    </div>
    <div id="compare-sim"></div>
    <div class="card">
      <h3 style="font-family:'Space Grotesk',sans-serif; font-size:14px; margin-bottom:10px;">Cómo funciona tu declaración trimestral</h3>
      <div id="quarterly-sim" style="font-size:13px; color:var(--text-dim); line-height:1.7;"></div>
    </div>`;
  renderSimBanners(); renderSimTranches(); renderSimCompare(); renderSimQuarterly();
}
function renderSimBanners(){
  const f = DB.fiscal; let html='';
  const today = new Date();
  if(f.vlRequested==='no'){
    const deadline = new Date(today.getFullYear(),8,30);
    const days = Math.ceil((deadline-today)/86400000);
    html += days>=0
      ? `<div class="card" style="border-color:var(--orange); background:rgba(255,122,61,.06);"><b>Ventana abierta:</b> pide el VL antes del 30/09/${today.getFullYear()} (quedan ${days} días) para que se active el 01/01/${today.getFullYear()+1}.</div>`
      : `<div class="card" style="border-color:var(--orange); background:rgba(255,122,61,.06);">Ya pasó el plazo de este año — la próxima ventana cierra el 30/09/${today.getFullYear()+1}.</div>`;
  } else {
    html += `<div class="card" style="border-color:var(--cyan); background:rgba(95,216,230,.06);">VL activo desde el 01/01/${vlActiveFromYear()}. Los cobros desde esa fecha aplican VL si sigues siendo elegible.</div>`;
  }
  document.getElementById('banners-sim').innerHTML = html;
}
function renderSimTranches(){
  const f = DB.fiscal;
  document.getElementById('tranches-sim').innerHTML = f.tranches.map(t=>{
    const r = regimeForTranche(t);
    return `<div style="display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);">
      <div><label>Etiqueta</label><input value="${t.label}" onchange="updateTranche(${t.id},'label',this.value)"></div>
      <div><label>Monto (€)</label><input type="number" value="${t.amount}" onchange="updateTranche(${t.id},'amount',this.value)"></div>
      <div><label>Fecha de cobro</label><input type="date" value="${t.date}" onchange="updateTranche(${t.id},'date',this.value)"></div>
      <div><label>Régimen</label><select onchange="updateTranche(${t.id},'regime',this.value)">
        <option value="auto" ${t.regime==='auto'?'selected':''}>Auto (${r==='vl'?'VL':'Clásico'})</option>
        <option value="classico" ${t.regime==='classico'?'selected':''}>Forzar clásico</option>
        <option value="vl" ${t.regime==='vl'?'selected':''}>Forzar VL</option></select></div>
      <button class="btn btn-sm btn-danger" onclick="removeTranche(${t.id})">✕</button>
    </div>`;
  }).join('');
  const total = f.tranches.reduce((s,t)=>s+t.amount,0);
  const pct = Math.min(100,(total/PLAFOND_CA)*100);
  document.getElementById('threshold-fill').style.width = pct+'%';
  document.getElementById('threshold-note').textContent = `CA total: ${fmt(total)} — ${pct.toFixed(1)}% del plafond micro-BNC (~${fmt(PLAFOND_CA)}/año, verificar cada año).`;
}
function addTranche(){ DB.fiscal.tranches.push({id:nextIds.tranches++, label:'Nuevo tramo', amount:0, date:new Date().toISOString().slice(0,10), regime:'auto'}); saveDB(); renderFiscalSimulador(document.getElementById('impuestos-body')); }
function removeTranche(id){ DB.fiscal.tranches = DB.fiscal.tranches.filter(t=>t.id!==id); saveDB(); renderFiscalSimulador(document.getElementById('impuestos-body')); }
function updateTranche(id, field, value){ const t = DB.fiscal.tranches.find(t=>t.id===id); if(!t) return; t[field] = field==='amount' ? (parseFloat(value)||0) : value; saveDB(); renderSimTranches(); renderSimCompare(); }
function renderSimCompare(){
  const f = DB.fiscal;
  const classico = f.tranches.filter(t=>regimeForTranche(t)==='classico');
  const vl = f.tranches.filter(t=>regimeForTranche(t)==='vl');
  const caClassico = classico.reduce((s,t)=>s+t.amount,0), caVl = vl.reduce((s,t)=>s+t.amount,0), caTotal = caClassico+caVl;
  const cotis = caTotal*f.cotisationRate;
  const irClassico = irOn(caClassico, f.autresRevenus, f.parts);
  const vlImp = caVl*VL_RATE;
  const totalReal = cotis+irClassico+vlImp;
  const irTodoClassico = irOn(caTotal, f.autresRevenus, f.parts);
  const totalTodoClassico = caTotal*f.cotisationRate + irTodoClassico;
  const totalTodoVl = caTotal*f.cotisationRate + caTotal*VL_RATE;
  const winner = totalTodoVl < totalTodoClassico ? 'vl' : 'classico';
  const saving = Math.abs(totalTodoClassico-totalTodoVl);
  document.getElementById('compare-sim').innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:16px;">
      <div class="card" style="${winner==='classico'?'border-color:var(--cyan);':''}">
        <div class="mono" style="font-size:11px; color:var(--text-faint); text-transform:uppercase;">Si todo fuera clásico</div>
        <div class="display" style="font-size:26px; font-weight:600; margin:6px 0;">${fmt(totalTodoClassico)}</div>
        <div style="font-size:12.5px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between;"><span>Cotizaciones</span><b class="mono">${fmt(caTotal*f.cotisationRate)}</b></div>
        <div style="font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between; padding-top:6px;"><span>IR adicional</span><b class="mono">${fmt(irTodoClassico)}</b></div>
      </div>
      <div class="card" style="${winner==='vl'?'border-color:var(--cyan);':''}">
        <div class="mono" style="font-size:11px; color:var(--text-faint); text-transform:uppercase;">Si todo fuera VL ${winner==='vl'?`· ahorra ${fmt(saving)}`:''}</div>
        <div class="display" style="font-size:26px; font-weight:600; margin:6px 0;">${fmt(totalTodoVl)}</div>
        <div style="font-size:12.5px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between;"><span>Cotizaciones</span><b class="mono">${fmt(caTotal*f.cotisationRate)}</b></div>
        <div style="font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between; padding-top:6px;"><span>VL fijo 2,2%</span><b class="mono">${fmt(caTotal*VL_RATE)}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="mono" style="font-size:11px; color:var(--text-faint); text-transform:uppercase; margin-bottom:10px;">Total real con tus tramos y fechas</div>
      <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border);"><span>Tramos clásico — ${fmt(caClassico)}</span><b class="mono">${fmt(caClassico*f.cotisationRate+irClassico)}</b></div>
      <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border);"><span>Tramos VL — ${fmt(caVl)}</span><b class="mono">${fmt(caVl*f.cotisationRate+vlImp)}</b></div>
      <div style="display:flex; justify-content:space-between; font-size:15px; padding:10px 0; border-top:2px solid var(--border);"><b>Total estimado</b><b class="mono">${fmt(totalReal)}</b></div>
    </div>`;
}
function renderSimQuarterly(){
  const vl = DB.fiscal.vlRequested==='si';
  document.getElementById('quarterly-sim').innerHTML = `
    <p>Cada trimestre declaras en autoentrepreneur.urssaf.fr el CA que <b style="color:var(--text);">cobraste</b>, no el que facturaste.</p>
    <p style="margin-top:8px;">Con VL activo: cotizaciones + VL se pagan juntos y eso liquida el impuesto — nada más que pagar el año siguiente por ese ingreso.</p>
    <p style="margin-top:8px;">Sin VL: solo pagas cotizaciones ese trimestre; el impuesto sobre la renta se liquida al año siguiente en tu déclaration, sumado a tu salario.</p>`;
}
